[tool.poetry]
package-mode = false
name = "proXXy"
version = "v2.7"
description = "A super simple asynchronous multithreaded proxy scraper; scraping & checking ~500k HTTP, HTTPS, SOCKS4, & SOCKS5 proxies."
authors = ["Solanaceae"]
license = "GPL-3.0 license"
readme = "README.md"

[tool.poetry.dependencies]
# scrapy, PyYAML and hrequests are not imported anywhere in this codebase;
# the <3.12 cap also blocked installing on any current Python. rich was
# missing even though src_check.py imports it directly.
python = ">=3.10"
pystyle = "^2.9"
yaspin = "^3.4.0"
tqdm = "^4.67.1"
aiohttp = "^3.13.3"
rich = "^13.9.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
